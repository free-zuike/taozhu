name: Build Windows & iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:                    # 仅 Flutter 相关改动才构建（Windows/iOS）
      - 'frontend-flutter/**'
      - '.github/workflows/build-desktop-ios.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platforms & build Windows exe
        working-directory: frontend-flutter
        run: |
          flutter create --org com.taozhu --project-name taozhu_app .
          flutter build windows --release

      - name: Package & upload Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $VERSION = (Select-String -Path "frontend-flutter/lib/version.dart" -Pattern "APP_VERSION = '([^']+)'").Matches[0].Groups[1].Value
          if (-not $VERSION) { $VERSION = "0.1.0.0" }
          Compress-Archive -Path "frontend-flutter/build/windows/x64/runner/Release/*" -DestinationPath "$env:TEMP/taozhu-windows-${VERSION}.zip"
          # 更新说明：上个版本 tag 以来的提交摘要
          git fetch --tags --quiet 2>$null
          $prev = (git tag --sort=-version:refname | Where-Object { $_ -ne "taozhu-v$VERSION" } | Select-Object -First 1)
          if ($prev) { $log = git log --format='- %s' --no-merges "$prev..HEAD" } else { $log = git log --format='- %s' --no-merges -8 }
          if (-not $log) { $log = "- 同步版本 $VERSION" }
          $notes = "陶朱 v$VERSION 更新内容：`n$log`n`n本版本全部产物：Android APK / Web / Windows / iOS / 微信小程序。"
          $REL = "taozhu-v$VERSION"
          gh release view $REL 2>$null; if (-not $?) {
            gh release create $REL --title "陶朱 v$VERSION" --notes $notes
          }
          gh release edit $REL --title "陶朱 v$VERSION" --notes $notes | Out-Null
          gh release upload $REL "$env:TEMP/taozhu-windows-${VERSION}.zip" --clobber
          echo "uploaded taozhu-windows-${VERSION}.zip"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platforms & build macOS
        working-directory: frontend-flutter
        run: |
          flutter create --org com.taozhu --project-name taozhu_app .
          flutter build macos --release

      - name: Package & upload macOS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" frontend-flutter/lib/version.dart || echo "0.1.0.0")
          cd frontend-flutter/build/macos/Build/Products/Release && zip -qr "/tmp/taozhu-macos-${VERSION}.zip" taozhu.app && cd -
          # 更新说明：上个版本 tag 以来的提交摘要
          git fetch --tags --quiet || true
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^taozhu-v${VERSION}$" | head -1)
          if [ -n "$PREV_TAG" ]; then LOG=$(git log --format='- %s' --no-merges "$PREV_TAG..HEAD"); else LOG=$(git log --format='- %s' --no-merges -8); fi
          if [ -z "$LOG" ]; then LOG="- 同步版本 ${VERSION}"; fi
          NOTES=$(printf '陶朱 v%s 更新内容：\n%s\n\n本版本全部产物：Android APK / Web / Windows / Linux / macOS / iOS / 微信小程序。' "$VERSION" "$LOG")
          REL="taozhu-v${VERSION}"
          if ! gh release view "$REL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$REL" --repo "$GITHUB_REPOSITORY" --title "陶朱 v${VERSION}" --notes "$NOTES"
          fi
          gh release edit "$REL" --repo "$GITHUB_REPOSITORY" --title "陶朱 v${VERSION}" --notes "$NOTES"
          gh release upload "$REL" "/tmp/taozhu-macos-${VERSION}.zip" --repo "$GITHUB_REPOSITORY" --clobber
          echo "uploaded taozhu-macos-${VERSION}.zip"

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platforms & build iOS (unsigned)
        working-directory: frontend-flutter
        run: |
          flutter create --org com.taozhu --project-name taozhu_app .
          flutter build ios --no-codesign

      - name: Package & upload iOS (unsigned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -n "s/.*APP_VERSION = '\([^']*\)'.*/\1/p" frontend-flutter/lib/version.dart | head -1 || echo "0.1.0.0")
          cd frontend-flutter/build/ios/iphoneos && zip -qr "/tmp/taozhu-ios-${VERSION}-unsigned.zip" Runner.app && cd -
          # 更新说明：上个版本 tag 以来的提交摘要
          git fetch --tags --quiet || true
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^taozhu-v${VERSION}$" | head -1)
          if [ -n "$PREV_TAG" ]; then LOG=$(git log --format='- %s' --no-merges "$PREV_TAG..HEAD"); else LOG=$(git log --format='- %s' --no-merges -8); fi
          if [ -z "$LOG" ]; then LOG="- 同步版本 ${VERSION}"; fi
          NOTES=$(printf '陶朱 v%s 更新内容：\n%s\n\n本版本全部产物：Android APK / Web / Windows / iOS / 微信小程序。' "$VERSION" "$LOG")
          REL="taozhu-v${VERSION}"
          if ! gh release view "$REL" >/dev/null 2>&1; then
            gh release create "$REL" --title "陶朱 v${VERSION}" --notes "$NOTES"
          fi
          gh release edit "$REL" --title "陶朱 v${VERSION}" --notes "$NOTES"
          gh release upload "$REL" "/tmp/taozhu-ios-${VERSION}-unsigned.zip" --clobber
          echo "uploaded taozhu-ios-${VERSION}-unsigned.zip（未签名，安装需 Apple 开发者证书）"