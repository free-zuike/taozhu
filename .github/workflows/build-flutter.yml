name: Build Flutter App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platforms (android/web/...)
        working-directory: frontend-flutter
        run: flutter create --org com.taozhu --project-name taozhu_app .

      - name: Build Web (Flutter)
        working-directory: frontend-flutter
        run: flutter build web

      - name: Build APK (release, 体积小)
        working-directory: frontend-flutter
        run: flutter build apk --release

      - name: Package & upload to single Release (taozhu-app)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" frontend/src/version.ts || echo "0.1.0.0")
          cp frontend-flutter/build/app/outputs/flutter-apk/app-release.apk "/tmp/flutter-app-${VERSION}.apk"
          cd frontend-flutter/build/web && zip -qr "/tmp/flutter-web-${VERSION}.zip" . && cd -
          REL="taozhu-app"
          if ! gh release view "$REL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$REL" --repo "$GITHUB_REPOSITORY" \
              --title "陶朱 v${VERSION}" \
              --notes "一个 Release 按版本累积全部产物。同版本重构建会覆盖同名文件，不重复堆积。"
          fi
          gh release edit "$REL" --repo "$GITHUB_REPOSITORY" --title "陶朱 v${VERSION}"
          gh release upload "$REL" "/tmp/flutter-app-${VERSION}.apk" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$REL" "/tmp/flutter-web-${VERSION}.zip" --repo "$GITHUB_REPOSITORY" --clobber
          echo "uploaded flutter-app/flutter-web ${VERSION}"