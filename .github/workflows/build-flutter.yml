name: Build Flutter App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:                    # 仅 Flutter 相关改动才构建（其它端改动跳过）
      - 'frontend-flutter/**'
      - '.github/workflows/build-flutter.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version guard（防覆盖已发布版本：同名 tag 已存在且非当前提交→失败）
        run: |
          VERSION=$(sed -n "s/.*APP_VERSION = '\([^']*\)'.*/\1/p" frontend-flutter/lib/version.dart | head -1)
          if [ -z "$VERSION" ]; then echo "::error::无法从 version.dart 提取版本号"; exit 1; fi
          git fetch --tags --quiet || true
          if git rev-parse -q --verify "refs/tags/taozhu-v${VERSION}" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "taozhu-v${VERSION}")
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::版本号未 bump：taozhu-v${VERSION} 已存在（指向 ${TAG_COMMIT}），当前提交 ${GITHUB_SHA}。发版前请先递增版本号（src/version.ts + frontend-flutter/lib/version.dart + frontend-uni/src/manifest.json + tests/api.test.ts 断言），否则产物会覆盖旧 release。"
              exit 1
            fi
          fi
          echo "版本守卫通过：v${VERSION}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('frontend-flutter/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Flutter version (Gradle 缓存键)
        id: fver
        working-directory: frontend-flutter
        run: echo "ver=$(flutter --version 2>/dev/null | sed -n 's/^Flutter \([0-9.]*\).*/\1/p')" >> "$GITHUB_OUTPUT"

      - name: Cache Gradle dependencies (Android 构建提速)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ steps.fver.outputs.ver }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate platforms (android/web/...)
        working-directory: frontend-flutter
        run: flutter create --org com.taozhu --project-name taozhu_app .

      - name: Build APK (release, 正式签名)
        working-directory: frontend-flutter
        env:
          ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_STORE_PASS }}
          ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_KEY_PASS }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          # ① Android 版本与应用版本号同步：versionName=三位版本号；versionCode=三位加权拼成正整数（单调递增，覆盖升级稳定）。
          #    不用改写 pubspec version：pub 的 version 格式只支持 x.y.z[+build]，四段 0.8.1.0 会判非法导致构建失败。
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" lib/version.dart || exit 1)
          BUILD_NUM=$(echo "$VERSION" | awk -F. '{print ($1*1000000)+($2*10000)+($3*100)}')
          # ② 包名统一 com.taozhu.app（与「陶朱」一致：避免两个应用并存、可覆盖升级）
          sed -i 's|namespace = ".*"|namespace = "com.taozhu.app"|; s|applicationId = ".*"|applicationId = "com.taozhu.app"|' android/app/build.gradle.kts
          # ②b MainActivity 类包与 applicationId 对齐——只改 namespace 不改类路径会 ClassNotFoundException 启动即崩
          if [ -f android/app/src/main/kotlin/com/taozhu/taozhu_app/MainActivity.kt ]; then
            sed -i 's|package com.taozhu.taozhu_app|package com.taozhu.app|' android/app/src/main/kotlin/com/taozhu/taozhu_app/MainActivity.kt
            mkdir -p android/app/src/main/kotlin/com/taozhu/app
            mv android/app/src/main/kotlin/com/taozhu/taozhu_app/MainActivity.kt android/app/src/main/kotlin/com/taozhu/app/MainActivity.kt
          fi
          # ②c 主 manifest 加 INTERNET 权限：Flutter 模板只在 debug/profile 清单有，release 无此权限=全部网络请求(DNS/连接)被拒→登录必失败
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><application|' android/app/src/main/AndroidManifest.xml
          # ②d 应用内更新：允许安装未知来源 APK（检查更新→下载→open_filex 触发安装器）
          sed -i 's|<application|<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/><application|' android/app/src/main/AndroidManifest.xml
          # ②e 最小权限：依赖库（image_picker 等）合并进来的媒体读取权限全部移除
          #     —— image_picker 1.1.x 用系统 Photo Picker / GET_CONTENT 选图，拍照走系统相机 Intent，均无需存储权限；
          #     tools:node="remove" 对不存在的权限是 no-op，未来依赖升级也安全。
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" tools:node="remove"/><uses-permission android:name="android.permission.READ_MEDIA_VIDEO" tools:node="remove"/><uses-permission android:name="android.permission.READ_MEDIA_AUDIO" tools:node="remove"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" tools:node="remove"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" tools:node="remove"/><application|' android/app/src/main/AndroidManifest.xml
          # 应用内更新 = 系统下载器（DownloadManager）：重写 MainActivity，注入 MethodChannel taozhu/download
          #     后台下载 + 通知栏（下滑栏）实时进度 + 下载完成回调状态，应用退到后台/被杀仍继续下载。
          #     源码在仓库 frontend-flutter/android-patch/MainActivity.kt（不 base64 内联，便于维护）
          #     注意：本步骤 working-directory=frontend-flutter，仓库根需用 ../ 前缀
          mkdir -p android/app/src/main/kotlin/com/taozhu/app
          cp ../frontend-flutter/android-patch/MainActivity.kt android/app/src/main/kotlin/com/taozhu/app/MainActivity.kt
          grep -q "DownloadManager" android/app/src/main/kotlin/com/taozhu/app/MainActivity.kt && echo "MainActivity 注入 OK"
          # ③ 应用显示名「陶朱」（新版模板写在 Manifest label；strings.xml 存在也一并改）
          sed -i 's|android:label="[^"]*"|android:label="陶朱"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">陶朱</string>|; s|<string name="title_activity_main">.*</string>|<string name="title_activity_main">陶朱</string>|' android/app/src/main/res/values/strings.xml || true
          # ④ 正式签名（复用与「陶朱」相同的 keystore）+ 关 R8（规避 release 闪退）
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/taozhu-release.keystore
          cat android-sign.gradle.kts >> android/app/build.gradle.kts
          # ⑤ 按 ABI 拆包构建（体积：universal ~62MB → arm64 单包 ~25MB；手机基本都是 arm64，下载减半以上）
          flutter build apk --release --split-per-abi --build-name="$VERSION" --build-number="$BUILD_NUM"

      - name: Package & upload to single Release (taozhu-app)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" frontend-flutter/lib/version.dart || exit 1)
          # 按 ABI 重命名并上传（app-arm64-v8a-release.apk / app-armeabi-v7a-release.apk / app-x86_64-release.apk）
          for APK in frontend-flutter/build/app/outputs/flutter-apk/app-*-release.apk; do
            ABI=$(basename "$APK" | sed 's/^app-//; s/-release\.apk$//')
            cp "$APK" "/tmp/flutter-app-${VERSION}-${ABI}.apk"
          done
          # 更新说明：上个版本 tag 以来的提交摘要
          git fetch --tags --quiet || true
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^taozhu-v${VERSION}$" | head -1)
          if [ -n "$PREV_TAG" ]; then LOG=$(git log --format='- %s' --no-merges "$PREV_TAG..HEAD"); else LOG=$(git log --format='- %s' --no-merges -8); fi
          if [ -z "$LOG" ]; then LOG="- 同步版本 ${VERSION}"; fi
          NOTES=$(printf '陶朱 v%s 更新内容：\n%s\n\n本版本全部产物：Android APK（按 ABI 拆包）/ Web / Windows / Linux / macOS / iOS / 微信小程序。' "$VERSION" "$LOG")
          REL="taozhu-v${VERSION}"
          # 等待 release 创建（deploy 或并发先到者创建，最多 5 分钟）
          for _i in $(seq 1 60); do gh release view "$REL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break; sleep 5; done
          if ! gh release view "$REL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 发布时间固定为该版本 commit 时间（多个 workflow 并发竞争创建时，保证 Release 列表按版本顺序排列）
            gh release create "$REL" --repo "$GITHUB_REPOSITORY" \
              --title "陶朱 v${VERSION}" --notes "$NOTES" \
              --published-at "$(git log -1 --format=%cI)" || true
          fi
          gh release edit "$REL" --repo "$GITHUB_REPOSITORY" --title "陶朱 v${VERSION}" --notes "$NOTES"
          for APK in /tmp/flutter-app-${VERSION}-*.apk; do
            gh release upload "$REL" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          done
          echo "uploaded flutter-app split ABIs ${VERSION}"