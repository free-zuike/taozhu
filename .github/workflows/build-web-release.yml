name: Build & Publish Web Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:                    # 仅 Flutter Web 相关改动才构建
      - 'frontend-flutter/**'
      - '.github/workflows/build-web-release.yml'

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version guard（防覆盖已发布版本：同名 tag 已存在且非当前提交→失败）
        run: |
          VERSION=$(sed -n "s/.*APP_VERSION = '\([^']*\)'.*/\1/p" frontend-flutter/lib/version.dart | head -1)
          if [ -z "$VERSION" ]; then echo "::error::无法从 version.dart 提取版本号"; exit 1; fi
          git fetch --tags --quiet || true
          if git rev-parse -q --verify "refs/tags/taozhu-v${VERSION}" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "taozhu-v${VERSION}")
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::版本号未 bump：taozhu-v${VERSION} 已存在（指向 ${TAG_COMMIT}），当前提交 ${GITHUB_SHA}。发版前请先递增版本号（src/version.ts + frontend-flutter/lib/version.dart + frontend-uni/src/manifest.json + tests/api.test.ts 断言），否则产物会覆盖旧 release。"
              exit 1
            fi
          fi
          echo "版本守卫通过：v${VERSION}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Web (Flutter, 不注入默认地址=个人自托管必填)
        working-directory: frontend-flutter
        run: |
          flutter create --org com.taozhu --project-name taozhu_app .
          # 统一浏览器标签标题（模板默认 taozhu_app，刷新瞬间会闪烁）
          sed -i 's|<title>.*</title>|<title>陶朱</title>|' web/index.html
          # CanvasKit 自托管：避免白屏期从 gstatic.com 下载渲染引擎（国内慢/不稳）
          mkdir -p web/canvaskit
          curl -fsSL -o web/canvaskit/canvaskit.js "https://www.gstatic.com/flutter-canvaskit/a804b261645ef8c13eb3d5c44a5c2fb0340c5539/chromium/canvaskit.js"
          curl -fsSL -o web/canvaskit/canvaskit.wasm "https://www.gstatic.com/flutter-canvaskit/a804b261645ef8c13eb3d5c44a5c2fb0340c5539/chromium/canvaskit.wasm"
          flutter build web --dart-define=FLUTTER_WEB_CANVASKIT_URL=/canvaskit/

      - name: Package web zip (同版本固定名，覆盖不重复)
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" frontend-flutter/lib/version.dart || exit 1)
          cd frontend-flutter/build/web && zip -qr "/tmp/web-${VERSION}.zip" . && cd -
          echo "web_zip=/tmp/web-${VERSION}.zip" >> "$GITHUB_ENV"
          echo "包: web-${VERSION}.zip"

      - name: Upload to single Release (taozhu-app, 按版本累积)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" frontend-flutter/lib/version.dart || exit 1)
          # 更新说明：上个版本 tag 以来的提交摘要
          git fetch --tags --quiet || true
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^taozhu-v${VERSION}$" | head -1)
          if [ -n "$PREV_TAG" ]; then LOG=$(git log --format='- %s' --no-merges "$PREV_TAG..HEAD"); else LOG=$(git log --format='- %s' --no-merges -8); fi
          if [ -z "$LOG" ]; then LOG="- 同步版本 ${VERSION}"; fi
          NOTES=$(printf '陶朱 v%s 更新内容：\n%s\n\n本版本全部产物：Android APK / Web / Windows / Linux / macOS / iOS / 微信小程序。' "$VERSION" "$LOG")
          REL="taozhu-v${VERSION}"
          # 等待 release 创建（deploy 或并发先到者创建，最多 5 分钟）
          for _i in $(seq 1 60); do gh release view "$REL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break; sleep 5; done
          if ! gh release view "$REL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 发布时间固定为该版本 commit 时间（并发创建时保证列表按版本顺序）
            gh release create "$REL" --repo "$GITHUB_REPOSITORY" \
              --title "陶朱 v${VERSION}" --notes "$NOTES" \
              --published-at "$(git log -1 --format=%cI)" || true
          fi
          gh release edit "$REL" --repo "$GITHUB_REPOSITORY" --title "陶朱 v${VERSION}" --notes "$NOTES"
          gh release upload "$REL" "${{ env.web_zip }}" --repo "$GITHUB_REPOSITORY" --clobber
          echo "uploaded: ${{ env.web_zip }}"
