name: Build & Publish Web Package

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-uni/package-lock.json

      - name: Install & build uni-app H5
        working-directory: frontend-uni
        run: |
          npm ci
          npm run build:h5

      - name: Package web zip (版本带时间戳)
        run: |
          VERSION=$(grep -oP '"versionName"\s*:\s*"\K[^"]+' frontend-uni/src/manifest.json || echo "0.1.0.0")
          TS=$(date +%Y%m%d-%H%M%S)
          cd frontend-uni/dist/build/h5 && zip -qr "/tmp/web-${VERSION}-${TS}.zip" . && cd -
          echo "web_zip=/tmp/web-${VERSION}-${TS}.zip" >> "$GITHUB_ENV"
          echo "包: web-${VERSION}-${TS}.zip"

      - name: Upload to single Release (taozhu-app, 累积全部版本)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REL="taozhu-app"
          if ! gh release view "$REL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$REL" --repo "$GITHUB_REPOSITORY" \
              --title "陶朱（全平台产物）" \
              --notes "一个 Release 累积全部版本的产物（APK / Web 包 / 后续 exe 等），按文件名（产物-版本-时间）选择下载。"
          fi
          gh release upload "$REL" "${{ env.web_zip }}" --repo "$GITHUB_REPOSITORY" --clobber
          echo "uploaded: ${{ env.web_zip }}"