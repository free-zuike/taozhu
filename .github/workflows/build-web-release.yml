name: Build & Publish Web Package

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build frontend (Element Plus → ./public)
        working-directory: frontend
        run: |
          npm ci
          npm run build:no-check

      - name: Package web zip (同版本固定名，覆盖不重复)
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" frontend/src/version.ts || echo "0.1.0.0")
          cd public && zip -qr "/tmp/web-${VERSION}.zip" . && cd -
          echo "web_zip=/tmp/web-${VERSION}.zip" >> "$GITHUB_ENV"
          echo "包: web-${VERSION}.zip"

      - name: Upload to single Release (taozhu-app, 按版本累积)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" frontend/src/version.ts || echo "0.1.0.0")
          REL="taozhu-app"
          if ! gh release view "$REL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$REL" --repo "$GITHUB_REPOSITORY" \
              --title "陶朱 v${VERSION}" \
              --notes "一个 Release 按版本累积全部产物（APK / Web 包 / Flutter 包 / 后续 exe）。同版本重构建会覆盖同名文件，不重复堆积。"
          fi
          gh release edit "$REL" --repo "$GITHUB_REPOSITORY" --title "陶朱 v${VERSION}"
          gh release upload "$REL" "${{ env.web_zip }}" --repo "$GITHUB_REPOSITORY" --clobber
          echo "uploaded: ${{ env.web_zip }}"