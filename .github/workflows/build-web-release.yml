name: Build & Publish Web Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:                    # 仅 Flutter Web 相关改动才构建
      - 'frontend-flutter/**'
      - '.github/workflows/build-web-release.yml'

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Web (Flutter, 不注入默认地址=个人自托管必填)
        working-directory: frontend-flutter
        run: |
          flutter create --org com.taozhu --project-name taozhu_app .
          flutter build web

      - name: Package web zip (同版本固定名，覆盖不重复)
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" frontend-flutter/lib/version.dart || echo "0.1.0.0")
          cd frontend-flutter/build/web && zip -qr "/tmp/web-${VERSION}.zip" . && cd -
          echo "web_zip=/tmp/web-${VERSION}.zip" >> "$GITHUB_ENV"
          echo "包: web-${VERSION}.zip"

      - name: Upload to single Release (taozhu-app, 按版本累积)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" frontend-flutter/lib/version.dart || echo "0.1.0.0")
          # 更新说明：上个版本 tag 以来的提交摘要
          git fetch --tags --quiet || true
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^taozhu-v${VERSION}$" | head -1)
          if [ -n "$PREV_TAG" ]; then LOG=$(git log --format='- %s' --no-merges "$PREV_TAG..HEAD"); else LOG=$(git log --format='- %s' --no-merges -8); fi
          if [ -z "$LOG" ]; then LOG="- 同步版本 ${VERSION}"; fi
          NOTES=$(printf '陶朱 v%s 更新内容：\n%s\n\n本版本全部产物：Android APK / Web / Windows / iOS / 微信小程序。' "$VERSION" "$LOG")
          REL="taozhu-v${VERSION}"
          if ! gh release view "$REL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$REL" --repo "$GITHUB_REPOSITORY" \
              --title "陶朱 v${VERSION}" --notes "$NOTES"
          fi
          gh release edit "$REL" --repo "$GITHUB_REPOSITORY" --title "陶朱 v${VERSION}" --notes "$NOTES"
          gh release upload "$REL" "${{ env.web_zip }}" --repo "$GITHUB_REPOSITORY" --clobber
          echo "uploaded: ${{ env.web_zip }}"
