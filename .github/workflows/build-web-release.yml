name: Build & Publish Web Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:                    # 仅 Flutter Web 相关改动才构建
      - 'frontend-flutter/**'
      - '.github/workflows/build-web-release.yml'

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Web (Flutter, 不注入默认地址=个人自托管必填)
        working-directory: frontend-flutter
        run: |
          flutter create --org com.taozhu --project-name taozhu_app .
          flutter build web

      - name: Package web zip (同版本固定名，覆盖不重复)
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" frontend-flutter/lib/version.dart || echo "0.1.0.0")
          cd frontend-flutter/build/web && zip -qr "/tmp/web-${VERSION}.zip" . && cd -
          echo "web_zip=/tmp/web-${VERSION}.zip" >> "$GITHUB_ENV"
          echo "包: web-${VERSION}.zip"

      - name: Upload to single Release (taozhu-app, 按版本累积)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" frontend-flutter/lib/version.dart || echo "0.1.0.0")
          REL="taozhu-app"
          if ! gh release view "$REL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$REL" --repo "$GITHUB_REPOSITORY" \
              --title "陶朱 v${VERSION}" \
              --notes "一个 Release 按版本累积全部产物（APK / Web 包 / Flutter 包 / 后续 exe）。同版本重构建会覆盖同名文件，不重复堆积。"
          fi
          gh release edit "$REL" --repo "$GITHUB_REPOSITORY" --title "陶朱 v${VERSION}"
          gh release upload "$REL" "${{ env.web_zip }}" --repo "$GITHUB_REPOSITORY" --clobber
          echo "uploaded: ${{ env.web_zip }}"
