name: Build Android APK

on:
  workflow_dispatch:          # 手动触发：Actions 页点 Run workflow
  push:
    tags: ['v*']              # 打 tag v* 自动构建

permissions:
  contents: write             # 发布 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest    # 自带 Android SDK / JDK / Gradle
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: https://taozhu.freezuike-3f7.workers.dev
        run: |
          npm ci
          npm run build:no-check

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Sync Capacitor (web → android)
        working-directory: frontend
        run: npx cap sync android

      - name: Setup signing keystore (固定签名)
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > frontend/android/app/taozhu-release.keystore

      - name: Build signed release APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/frontend/android/app/taozhu-release.keystore
          ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_STORE_PASS }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Publish APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' frontend/android/app/build.gradle)
          TAG="taozhu-v${VERSION}-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            frontend/android/app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "陶朱 v${VERSION} Android" \
            --notes "下载 app-release.apk 传到手机安装（允许未知来源）；服务器地址在 App 登录页手动填写"

      - name: Upload APK (artifact backup)
        uses: actions/upload-artifact@v4
        with:
          name: taozhu-release-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error