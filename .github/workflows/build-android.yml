name: Build Android APK

on:
  workflow_dispatch:          # 手动触发：Actions 页点 Run workflow
  push:
    tags: ['v*']              # 打 tag v* 自动构建

permissions:
  contents: write             # 发布 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest    # 自带 Android SDK / JDK / Gradle
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: https://taozhu.freezuike-3f7.workers.dev
        run: |
          npm ci
          npm run build:no-check

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Sync Capacitor (web → android)
        working-directory: frontend
        run: npx cap sync android

      - name: Setup signing keystore (固定签名)
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > frontend/android/app/taozhu-release.keystore

      - name: Build signed release APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/frontend/android/app/taozhu-release.keystore
          ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_STORE_PASS }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Publish APK to Release (单 Release 按版本累积)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' frontend/android/app/build.gradle)
          # 固定名：同版本重构建覆盖同名，不同版本共存，不堆积时间戳变体
          cp frontend/android/app/build/outputs/apk/release/app-release.apk "/tmp/app-${VERSION}.apk"
          REL="taozhu-v${VERSION}"
          if ! gh release view "$REL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$REL" --repo "$GITHUB_REPOSITORY" \
              --title "陶朱 v${VERSION}" \
              --notes "陶朱 v${VERSION}：本版本全部产物（Android APK / Web / Windows / iOS）。同版本重构建覆盖同名文件。"
          fi
          gh release edit "$REL" --repo "$GITHUB_REPOSITORY" --title "陶朱 v${VERSION}"
          gh release upload "$REL" "/tmp/app-${VERSION}.apk" --repo "$GITHUB_REPOSITORY" --clobber
          echo "uploaded: app-${VERSION}.apk"

      - name: Upload APK (artifact backup)
        uses: actions/upload-artifact@v4
        with:
          name: taozhu-release-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error