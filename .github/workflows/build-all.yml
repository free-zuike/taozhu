  # ── 微信小程序（uni-app）──────────────────────────────────────────────────────────
  # 依赖全部平台成功：任一 Flutter 端失败则小程序不构建/不上传（全通过或全不通过）
  # ── 平台产物门槛：主仓库=5 平台全部成功才继续；fork 用户（平台 job 跳过）视为通过 ──
  platform-gate:
    needs: [apk, linux, windows, macos, ios]
    if: ${{ always() && (github.repository != 'free-zuike/taozhu' || (needs.apk.result == 'success' && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success' && needs.ios.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "platform gate ok"

  miniprogram:
    needs: [test, platform-gate]
    runs-on: ubuntu-latest
    name: 微信小程序
    steps:
      - uses: actions/checkout@v4

      - name: Version guard（防覆盖已发布版本：同名 tag 已存在且非当前提交→失败，与各端守卫一致）
        id: guard
        run: |
          VERSION=$(grep -oP '"versionName"\s*:\s*"\K[^"]+' frontend-uni/src/manifest.json | head -1)
          if [ -z "$VERSION" ]; then echo "::error::无法从 manifest.json 提取版本号"; exit 1; fi
          git fetch --tags --quiet || true
          if git rev-parse -q --verify "refs/tags/taozhu-v${VERSION}" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "taozhu-v${VERSION}")
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::版本号未 bump：taozhu-v${VERSION} 已存在（指向 ${TAG_COMMIT}），当前提交 ${GITHUB_SHA}。发版前请先递增版本号，否则产物会覆盖旧 release。"
              exit 1
            fi
          fi
          echo "版本守卫通过：v${VERSION}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-uni/package-lock.json

      # uni-app 依赖 node_modules 缓存（锁文件不变则 npm ci 几乎秒过）
      - name: Cache miniprogram node_modules
        uses: actions/cache@v4
        with:
          path: frontend-uni/node_modules
          key: uni-npm-${{ hashFiles('frontend-uni/package-lock.json') }}
          restore-keys: |
            uni-npm-

      - name: Install & build mp-weixin
        working-directory: frontend-uni
        run: |
          npm ci
          npm run build:mp-weixin

      - name: Upload to WeChat platform (miniprogram-ci)
        # 仅在配了密钥时上传；未配则跳过（只打 zip 留底）
        if: ${{ env.WX_APPID != '' && env.WX_PRIVATE_KEY != '' }}
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_PRIVATE_KEY: ${{ secrets.WX_PRIVATE_KEY }}
        run: |
          VERSION=$(grep -oP '"versionName"\s*:\s*"\K[^"]+' frontend-uni/src/manifest.json || echo "0.0.0")
          # 微信版本号要求 x.y.z（三段），截版本前三段
          MP_VER=$(echo "$VERSION" | cut -d. -f1-3)
          echo "$WX_PRIVATE_KEY" | base64 -d > /tmp/private.key
          npx miniprogram-ci@latest upload \
            --pp frontend-uni/dist/build/mp-weixin \
            --pkp /tmp/private.key \
            --appid "$WX_APPID" \
            --upload-version "$MP_VER" \
            --upload-message "陶朱 v$VERSION 自动上传" \
            -r 1 \
            || echo "::warning::微信上传失败（密钥/网络/白名单），详见日志；zip 产物已留底"
          rm -f /tmp/private.key

      - name: Package & upload to version Release
        # 有微信上传密钥才打包/上传（fork 用户未配 secrets 则跳过打 zip）
        if: ${{ env.WX_APPID != '' && env.WX_PRIVATE_KEY != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_PRIVATE_KEY: ${{ secrets.WX_PRIVATE_KEY }}
        run: |
          VERSION=$(grep -oP '"versionName"\s*:\s*"\K[^"]+' frontend-uni/src/manifest.json || exit 1)
          cd frontend-uni/dist/build/mp-weixin && zip -qr "/tmp/taozhu-miniprogram-${VERSION}.zip" . && cd -
          git fetch --tags --quiet || true
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^taozhu-v${VERSION}$" | head -1)
          if [ -n "$PREV_TAG" ]; then LOG=$(git log --format='- %s' --no-merges "$PREV_TAG..HEAD"); else LOG=$(git log --format='- %s' --no-merges -8); fi
          if [ -z "$LOG" ]; then LOG="- 同步版本 ${VERSION}"; fi
          NOTES=$(printf '陶朱 v%s 更新内容：\n%s\n\n本版本全部产物：Android APK / Web / Windows / Linux / macOS / iOS / 微信小程序。' "$VERSION" "$LOG")
          REL="taozhu-v${VERSION}"
          if ! gh release view "$REL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$REL" --repo "$GITHUB_REPOSITORY" \
              --title "陶朱 v${VERSION}" --notes "$NOTES"
          fi
          for _c in 1 2 3 4 5; do
            gh release upload "$REL" "/tmp/taozhu-miniprogram-${VERSION}.zip" --repo "$GITHUB_REPOSITORY" --clobber && break
            echo "upload 重试 $_c/5 (taozhu-miniprogram-${VERSION}.zip)"
            sleep 5
          done
          # 完整性校验：产物必须上传成功，缺失 → 删除整个 release 并失败（不留不全的 release）
          if ! gh release view "$REL" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "taozhu-miniprogram-${VERSION}.zip"; then
            echo "::error::release $REL 资产不完整，按发版规则删除整个 release，请递增版本号重新构建"
            gh release delete "$REL" --repo "$GITHUB_REPOSITORY" --yes || true
            exit 1
          fi
          echo "uploaded taozhu-miniprogram-${VERSION}.zip"

      - name: 失败即清理不完整 release
        # 仅版本守卫通过后的失败才清理（版本守卫失败=版本未 bump，已发布的完整 release 应保留）
        if: failure() && steps.guard.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP '"versionName"\s*:\s*"\K[^"]+' frontend-uni/src/manifest.json || true)
          [ -n "$VERSION" ] && gh release delete "taozhu-v${VERSION}" --repo "$GITHUB_REPOSITORY" --yes || true

  # ── Web（Flutter）构建：与各平台并行，最后 Deploy 直接用其产物（避免 Web 构建串行在链尾）──
  web:
    needs: [test, release, check]
    # Web（构建 + 部署 CF）一体：主仓库或配了 CF token 才构建；无 token → web/deploy 整链跳过
    if: needs.check.outputs.has_cf == 'true'
    runs-on: ubuntu-latest
    name: Web（Flutter）
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          version: 3.47.2
          cache: true
      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('frontend-flutter/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Build Web (Flutter) with production API_BASE
        working-directory: frontend-flutter
        run: |
          flutter create --org com.taozhu --project-name taozhu_app .
          sed -i 's|<title>.*</title>|<title>陶朱</title>|' web/index.html
          mkdir -p web/canvaskit
          curl -fsSL -o web/canvaskit/canvaskit.js "https://www.gstatic.com/flutter-canvaskit/a804b261645ef8c13eb3d5c44a5c2fb0340c5539/chromium/canvaskit.js"
          curl -fsSL -o web/canvaskit/canvaskit.wasm "https://www.gstatic.com/flutter-canvaskit/a804b261645ef8c13eb3d5c44a5c2fb0340c5539/chromium/canvaskit.wasm"
          flutter build web --dart-define=API_BASE=https://taozhu.freezuike-3f7.workers.dev --dart-define=FLUTTER_WEB_CANVASKIT_URL=/canvaskit/ --pwa-strategy=none
          flutter build web --dart-define=FLUTTER_WEB_CANVASKIT_URL=/canvaskit/ -o build/web-standalone --pwa-strategy=none
      - name: Package & upload web zip (个人自托管分发，同版本固定名)
        if: github.repository == 'free-zuike/taozhu'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\\K[^']+" src/version.ts || exit 1)
          cd frontend-flutter/build/web-standalone && zip -qr "/tmp/web-${VERSION}.zip" . && cd -
          for _c in 1 2 3 4 5; do
            gh release upload "taozhu-v${VERSION}" "/tmp/web-${VERSION}.zip" --repo "$GITHUB_REPOSITORY" --clobber && break
            echo "upload 重试 $_c/5 (web-${VERSION}.zip)"
            sleep 5
          done
          echo "uploaded: web-${VERSION}.zip"
      - name: Upload web build artifact (供最后 Deploy 使用)
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: frontend-flutter/build/web
          retention-days: 1

  deploy:
    needs: [miniprogram, web]
    runs-on: ubuntu-latest
    name: Deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend deps
        run: npm install

      # 门禁已由 test job（依赖链首环）保证：deploy 是链尾，不需重复 typecheck/test
      - name: Download web build artifact (由 web job 并行构建)
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: frontend-flutter/build/web

      - name: Swap public dir with Flutter web build
        run: |
          rm -rf public
          cp -r frontend-flutter/build/web public

      # 检查更新兜底源：随部署生成 latest.json（与后端版本一致，Worker 在读 GitHub 失败时返回它）
      - name: Generate latest.json (version metadata)
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" src/version.ts || exit 1)
          printf '{"version":"%s","time":"%s"}' "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/latest.json
          cat public/latest.json

      - name: Setup D1 database (auto-create if missing)
        if: env.CLOUDFLARE_API_TOKEN != ''
        id: d1
        run: |
          DB_ID=$(npx wrangler d1 list --json 2>/dev/null | node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const db = (data || []).find(d => d.name === 'taozhu');
            if (db) process.stdout.write(db.uuid);
          " || true)
          if [ -z "$DB_ID" ]; then
            echo "No existing D1 found, creating taozhu..."
            npx wrangler d1 create taozhu 2>&1 | tee create_out.txt || true
            DB_ID=$(grep -oP '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}' create_out.txt 2>/dev/null || true)
          fi
          if [ -z "$DB_ID" ]; then
            echo "FATAL: Could not resolve database_id"
            exit 1
          fi
          echo "database_id=$DB_ID" >> $GITHUB_OUTPUT
          echo "Resolved D1 database_id: $DB_ID"

      - name: Resolve account ID
        if: env.CLOUDFLARE_API_TOKEN != ''
        id: account
        run: |
          ACCOUNT_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=100" \
            | node -e "
              const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              if (!d.success || !d.result || d.result.length === 0) {
                console.error('Failed to resolve account_id:', JSON.stringify(d.errors || {}));
                process.exit(1);
              }
              process.stdout.write(d.result[0].id);
            ")
          if [ -z "$ACCOUNT_ID" ]; then
            echo "FATAL: Could not resolve account_id"
            exit 1
          fi
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "Resolved account_id: $ACCOUNT_ID"

      - name: Inject database_id into wrangler.toml
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          node -e "const fs=require('fs');let t=fs.readFileSync('wrangler.toml','utf8');t=t.replace('PLACEHOLDER_DATABASE_ID',process.argv[1]);fs.writeFileSync('wrangler.toml',t);" "${{ steps.d1.outputs.database_id }}"

      # 部署前建表（幂等）：生产库的表结构在发布时初始化，
      # 请求路径的 ensureSchema 降级为只读兜底，不再消耗每日 D1 写配额
      - name: Apply D1 schema (idempotent)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 execute taozhu --remote --file src/schema.sql

      # 附件 R2 bucket（不存在则创建；已存在会报 10004，忽略即可——幂等）
      # 不依赖 r2 bucket list 输出格式做存在性判断，避免误判
      - name: Setup R2 bucket (idempotent)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx wrangler r2 bucket create taozhu-attachments 2>&1 || true

      - name: Set JWT_SECRET
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler secret put JWT_SECRET --name taozhu <<< "${{ secrets.JWT_SECRET }}"

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}

      - name: 部署失败 → 删除整个 release 全部回退（本版本作废，需递增版本号重建）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" src/version.ts || true)
          [ -n "$VERSION" ] && gh release delete "taozhu-v${VERSION}" --repo "$GITHUB_REPOSITORY" --yes || true

