name: Build All Platforms

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:                    # 前端/后端/小程序改动均触发：测试→全平台构建→小程序→最后部署（deploy 已并入本 workflow）
      - 'frontend-flutter/**'
      - 'frontend-uni/**'
      - 'src/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.dev.vars.example'
      - '.github/workflows/build-all.yml'

permissions:
  contents: write
  actions: write    # 失败时取消整个 run（gh run cancel），省掉后续平台的无效构建时间

jobs:
  # ── 总开关：主仓库正常执行；fork 用户若未配置任何 secrets（无微信上传、无 Cloudflare token）→
  # 整个 workflow 跳过（test 也不需要跑）；配了任一 secrets 则按需执行对应环节 ──
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.chk.outputs.should_run }}
      has_cf: ${{ steps.chk.outputs.has_cf }}
    env:
      WX_APPID: ${{ secrets.WX_APPID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - id: chk
        run: |
          if [ "$GITHUB_REPOSITORY" = "free-zuike/taozhu" ] || [ -n "$WX_APPID" ] || [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi
          # Web（构建 + 部署 Cloudflare）是同一功能：仅主仓库或配了 CF token 才需要构建
          if [ "$GITHUB_REPOSITORY" = "free-zuike/taozhu" ] || [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "has_cf=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cf=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 统一测试门禁：任一平台构建都依赖本 job 通过（needs: test），测试失败全部自动跳过 ──
  test:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    name: Test（vitest + typecheck）
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # 后端依赖 node_modules 缓存（锁文件不变则免 npm ci 重装，Test 从分钟级降到秒级）
      - name: Cache backend node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: backend-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            backend-npm-

      - name: Install backend deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
  # ── 前端单测（Flutter）：纯逻辑测试（版本函数等），不依赖网络/后端 mock ──

  # ── 统一创建 Release（test 后第一件事）：各平台上传资产前 release 必须已存在——
  # 创建时刻按 push 顺序单调递增（列表顺序稳定）；各平台 job 只上传资产，不再 5 分钟等待/竞争创建 ──

  # ── Android APK（正式签名，按 ABI 拆包 + universal 兜底）────────────────────────────
  apk:
    needs: [test]
    if: github.repository == 'free-zuike/taozhu'
    runs-on: ubuntu-latest
    name: Android APK
    steps:
      - uses: actions/checkout@v4

      - name: Version guard（防覆盖已发布版本：同名 tag 已存在且非当前提交→失败）
        id: guard
        run: |
          VERSION=$(sed -n "s/.*APP_VERSION = '\([^']*\)'.*/\1/p" frontend-flutter/lib/version.dart | head -1)
          if [ -z "$VERSION" ]; then echo "::error::无法从 version.dart 提取版本号"; exit 1; fi
          git fetch --tags --quiet || true
          if git rev-parse -q --verify "refs/tags/taozhu-v${VERSION}" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "taozhu-v${VERSION}")
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::版本号未 bump：taozhu-v${VERSION} 已存在（指向 ${TAG_COMMIT}），当前提交 ${GITHUB_SHA}。发版前请先递增版本号（src/version.ts + frontend-flutter/lib/version.dart + frontend-uni/src/manifest.json + tests/api.test.ts 断言），否则产物会覆盖旧 release。"
              exit 1
            fi
          fi
          echo "版本守卫通过：v${VERSION}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('frontend-flutter/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Flutter version (Gradle 缓存键)
        id: fver
        working-directory: frontend-flutter
        run: echo "ver=$(flutter --version 2>/dev/null | sed -n 's/^Flutter \([0-9.]*\).*/\1/p')" >> "$GITHUB_OUTPUT"

      - name: Cache Gradle dependencies (Android 构建提速)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ steps.fver.outputs.ver }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate platforms (android/web/...)
        working-directory: frontend-flutter
        run: flutter create --org com.taozhu --project-name taozhu_app .

      - name: Build APK (release, 正式签名) + 前端单测
        working-directory: frontend-flutter
        env:
          ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_STORE_PASS }}
          ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_KEY_PASS }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          # flutter create 生成的脚手架 test/widget_test.dart 引用不存在的 MyApp（根类是 TaoZhuApp），
          # 全目录跑测试必编译失败——删掉后 test/ 仅剩真实单测（statement_totals/version）
          rm -f test/widget_test.dart
          # 模板 widget_test.dart（flutter create 生成，引用不存在的 MyApp）会干扰全量单测，先删掉
          rm -f test/widget_test.dart && flutter test test/ || exit 1
          # ① Android 版本与应用版本号同步：versionName=三位版本号；versionCode=三位加权拼成正整数（单调递增，覆盖升级稳定）。
          #    不用改写 pubspec version：pub 的 version 格式只支持 x.y.z[+build]，四段 0.8.1.0 会判非法导致构建失败。
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" lib/version.dart || exit 1)
          BUILD_NUM=$(echo "$VERSION" | awk -F. '{print ($1*1000000)+($2*10000)+($3*100)}')
          # ② 包名统一 com.taozhu.app（与「陶朱」一致：避免两个应用并存、可覆盖升级）
          sed -i 's|namespace = ".*"|namespace = "com.taozhu.app"|; s|applicationId = ".*"|applicationId = "com.taozhu.app"|' android/app/build.gradle.kts
          # ②b MainActivity 类包与 applicationId 对齐——只改 namespace 不改类路径会 ClassNotFoundException 启动即崩
          if [ -f android/app/src/main/kotlin/com/taozhu/taozhu_app/MainActivity.kt ]; then
            sed -i 's|package com.taozhu.taozhu_app|package com.taozhu.app|' android/app/src/main/kotlin/com/taozhu/taozhu_app/MainActivity.kt
            mkdir -p android/app/src/main/kotlin/com/taozhu/app
            mv android/app/src/main/kotlin/com/taozhu/taozhu_app/MainActivity.kt android/app/src/main/kotlin/com/taozhu/app/MainActivity.kt
          fi
          # ②c 主 manifest 加 INTERNET 权限：Flutter 模板只在 debug/profile 清单有，release 无此权限=全部网络请求(DNS/连接)被拒→登录必失败
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><application|' android/app/src/main/AndroidManifest.xml
          # ②d 应用内更新：允许安装未知来源 APK（检查更新→下载→open_filex 触发安装器）
          sed -i 's|<application|<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/><application|' android/app/src/main/AndroidManifest.xml
          # ②e 最小权限：依赖库（image_picker 等）合并进来的媒体读取权限全部移除
          #     —— image_picker 1.1.x 用系统 Photo Picker / GET_CONTENT 选图，拍照走系统相机 Intent，均无需存储权限；
          #     tools:node="remove" 对不存在的权限是 no-op，未来依赖升级也安全。
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" tools:node="remove"/><uses-permission android:name="android.permission.READ_MEDIA_VIDEO" tools:node="remove"/><uses-permission android:name="android.permission.READ_MEDIA_AUDIO" tools:node="remove"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" tools:node="remove"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" tools:node="remove"/><application|' android/app/src/main/AndroidManifest.xml
          # ②f 微信/系统分享图片 → App 自动识别记账：MainActivity 接收 ACTION_SEND image/*
          #    （图片「分享到陶朱」→ 复制到应用缓存 → MethodChannel 交 Flutter 识别填行，可修改后保存）
          #    用脚本幂等注入（sed 行级判断会把已有 launchMode 的模板追加出重复属性 → XML 解析失败）
          python3 ../scripts/inject-share-manifest.py android/app/src/main/AndroidManifest.xml
          # 应用内更新 = 系统下载器（DownloadManager）：重写 MainActivity，注入 MethodChannel taozhu/download
          #     后台下载 + 通知栏（下滑栏）实时进度 + 下载完成回调状态，应用退到后台/被杀仍继续下载。
          #     源码在仓库 frontend-flutter/android-patch/MainActivity.kt（不 base64 内联，便于维护）
          #     注意：本步骤 working-directory=frontend-flutter，仓库根需用 ../ 前缀
          mkdir -p android/app/src/main/kotlin/com/taozhu/app
          cp ../frontend-flutter/android-patch/MainActivity.kt android/app/src/main/kotlin/com/taozhu/app/MainActivity.kt
          grep -q "DownloadManager" android/app/src/main/kotlin/com/taozhu/app/MainActivity.kt && echo "MainActivity 注入 OK"
          # ③ 应用显示名「陶朱」（新版模板写在 Manifest label；strings.xml 存在也一并改）
          sed -i 's|android:label="[^"]*"|android:label="陶朱"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">陶朱</string>|; s|<string name="title_activity_main">.*</string>|<string name="title_activity_main">陶朱</string>|' android/app/src/main/res/values/strings.xml || true
          # ③b 应用图标：陶朱 v21 自设计（铜钱+竹简；frontend-flutter/icons 各密度 PNG 替换 flutter 默认图标）
          #     用整图替代 adaptive（mipmap-anydpi-v26 引用前景安全区会裁切圆形设计，删之走传统 PNG 图标）
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            case $d in
              mdpi) S=48;; hdpi) S=72;; xhdpi) S=96;; xxhdpi) S=144;; xxxhdpi) S=192;;
            esac
            cp ../frontend-flutter/icons/ic_launcher_${S}.png android/app/src/main/res/mipmap-${d}/ic_launcher.png
            cp ../frontend-flutter/icons/ic_launcher_${S}.png android/app/src/main/res/mipmap-${d}/ic_launcher_round.png 2>/dev/null || true
          done
          echo "App 图标替换 OK"
          # ④ 正式签名（复用与「陶朱」相同的 keystore）+ 关 R8（规避 release 闪退）
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/taozhu-release.keystore
          cat android-sign.gradle.kts >> android/app/build.gradle.kts
          # ⑤ 按 ABI 拆包构建（体积：universal ~62MB → arm64 单包 ~25MB；手机基本都是 arm64，下载减半以上）
          flutter build apk --release --split-per-abi --build-name="$VERSION" --build-number="$BUILD_NUM"
          # ⑤b 同时保留 universal 包（taozhu-app-{v}.apk）：ABI 查询失败的兜底与桌面/模拟器兼容
          flutter build apk --release --build-name="$VERSION" --build-number="$BUILD_NUM"

      - name: Package APK (universal + split ABIs)
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" frontend-flutter/lib/version.dart || exit 1)
          # 统一产物命名：taozhu-app-{v}.apk（universal）+ taozhu-app-{v}-{abi}.apk（拆包）
          cp frontend-flutter/build/app/outputs/flutter-apk/app-release.apk "/tmp/taozhu-app-${VERSION}.apk"
          # 按 ABI 重命名（app-arm64-v8a-release.apk / app-armeabi-v7a-release.apk / app-x86_64-release.apk）
          for APK in frontend-flutter/build/app/outputs/flutter-apk/app-*-release.apk; do
            ABI=$(basename "$APK" | sed 's/^app-//; s/-release\.apk$//')
            cp "$APK" "/tmp/taozhu-app-${VERSION}-${ABI}.apk"
          done
          ls -lh /tmp/taozhu-app-${VERSION}*.apk

      # 产物先落 GitHub Actions artifact（不发 release）：全部平台成功后由 publish job 统一创建 release 并上传——
      # 任一平台失败则不创建 release=零残留（修复"失败留半成品 release/draft"根因）
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-apk
          path: /tmp/taozhu-app-*.apk
          retention-days: 1

      - name: 失败即取消整个 run（省掉其它平台的无效构建时间）
        if: failure() && steps.guard.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run cancel "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" || true
          echo "已取消整个 workflow（本版本未创建 release，无残留）"

  # ── Linux 桌面 ─────────────────────────────────────────────────────────────────────
  linux:
    needs: [test, check]
    if: ${{ github.repository == 'free-zuike/taozhu' || needs.check.outputs.has_cf == 'true' }}
    runs-on: ubuntu-latest
    name: Linux 桌面
    steps:
      - uses: actions/checkout@v4

      - name: Version guard（防覆盖已发布版本：同名 tag 已存在且非当前提交→失败）
        id: guard
        run: |
          VERSION=$(sed -n "s/.*APP_VERSION = '\([^']*\)'.*/\1/p" frontend-flutter/lib/version.dart | head -1)
          if [ -z "$VERSION" ]; then echo "::error::无法从 version.dart 提取版本号"; exit 1; fi
          git fetch --tags --quiet || true
          if git rev-parse -q --verify "refs/tags/taozhu-v${VERSION}" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "taozhu-v${VERSION}")
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::版本号未 bump：taozhu-v${VERSION} 已存在（指向 ${TAG_COMMIT}），当前提交 ${GITHUB_SHA}。发版前请先递增版本号，否则产物会覆盖旧 release。"
              exit 1
            fi
          fi
          echo "版本守卫通过：v${VERSION}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('frontend-flutter/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Generate platforms & build Linux
        if: github.repository == 'free-zuike/taozhu'
        working-directory: frontend-flutter
        run: |
          flutter create --org com.taozhu --project-name taozhu_app .
          flutter build linux --release

      - name: Package Linux zip
        if: github.repository == 'free-zuike/taozhu'
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" frontend-flutter/lib/version.dart || exit 1)
          cd frontend-flutter/build/linux/x64/release/bundle && zip -qr "/tmp/taozhu-linux-${VERSION}.zip" . && cd -
          ls -lh "/tmp/taozhu-linux-${VERSION}.zip"

      - name: Upload linux artifact
        if: github.repository == 'free-zuike/taozhu'
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: /tmp/taozhu-linux-*.zip
          retention-days: 1

      - name: 失败即取消整个 run（省掉其它平台的无效构建时间）
        if: failure() && steps.guard.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run cancel "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" || true
          echo "已取消整个 workflow（本版本未创建 release，无残留）"

      - name: Setup Flutter
        if: needs.check.outputs.has_cf == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true
      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('frontend-flutter/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Build Web (Flutter) with production API_BASE
        working-directory: frontend-flutter
        run: |
          flutter create --org com.taozhu --project-name taozhu_app .
          sed -i 's|<title>.*</title>|<title>陶朱</title>|' web/index.html
          mkdir -p web/canvaskit
          curl -fsSL -o web/canvaskit/canvaskit.js "https://www.gstatic.com/flutter-canvaskit/a804b261645ef8c13eb3d5c44a5c2fb0340c5539/chromium/canvaskit.js"
          curl -fsSL -o web/canvaskit/canvaskit.wasm "https://www.gstatic.com/flutter-canvaskit/a804b261645ef8c13eb3d5c44a5c2fb0340c5539/chromium/canvaskit.wasm"
          flutter build web --dart-define=API_BASE=https://taozhu.freezuike-3f7.workers.dev --dart-define=FLUTTER_WEB_CANVASKIT_URL=/canvaskit/ --pwa-strategy=none
          flutter build web --dart-define=FLUTTER_WEB_CANVASKIT_URL=/canvaskit/ -o build/web-standalone --pwa-strategy=none
      - name: Package web zip (个人自托管分发，同版本固定名)
        if: github.repository == 'free-zuike/taozhu'
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\\K[^']+" src/version.ts || exit 1)
          cd frontend-flutter/build/web-standalone && zip -qr "/tmp/web-${VERSION}.zip" . && cd -
          ls -lh "/tmp/web-${VERSION}.zip"
      - name: Upload web zip artifact (统一 publish 上传 release)
        if: github.repository == 'free-zuike/taozhu'
        uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: /tmp/web-*.zip
          retention-days: 1
      - name: Upload web build artifact (供最后 Deploy 使用)
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: frontend-flutter/build/web
          retention-days: 1
  # ── Windows 桌面 ────────────────────────────────────────────────────────────────────
  windows:
    needs: [test]
    if: github.repository == 'free-zuike/taozhu'
    runs-on: windows-latest
    name: Windows 桌面
    env:
      PUB_CACHE: ${{ github.workspace }}\.pub-cache
    steps:
      - uses: actions/checkout@v4

      - name: Version guard（防覆盖已发布版本：同名 tag 已存在且非当前提交→失败）
        id: guard
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*APP_VERSION = '\([^']*\)'.*/\1/p" frontend-flutter/lib/version.dart | head -1)
          if [ -z "$VERSION" ]; then echo "::error::无法从 version.dart 提取版本号"; exit 1; fi
          git fetch --tags --quiet || true
          if git rev-parse -q --verify "refs/tags/taozhu-v${VERSION}" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "taozhu-v${VERSION}")
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::版本号未 bump：taozhu-v${VERSION} 已存在（指向 ${TAG_COMMIT}），当前提交 ${GITHUB_SHA}。发版前请先递增版本号，否则产物会覆盖旧 release。"
              exit 1
            fi
          fi
          echo "版本守卫通过：v${VERSION}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true

      - name: Cache Flutter pub dependencies (Windows)
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('frontend-flutter/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Generate platforms & build Windows exe
        working-directory: frontend-flutter
        shell: bash
        run: |
          flutter create --org com.taozhu --project-name taozhu_app .
          # permission_handler_windows 0.2.x 用废弃 <experimental/coroutine>，新版 MSVC 18 报 C2338 硬错误；
          # 官方提示注入 _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS 抑制（CMake 目录级定义，插件子目录生效）
          # 注意：sed 的 \n 在 Git Bash 输出字面字符，必须用 i 插入命令（匹配行前插一行）
          sed -i '/^include(flutter\/generated_plugins.cmake)$/i\add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)' windows/CMakeLists.txt
          flutter build windows --release

      - name: Package Windows zip
        run: |
          $VERSION = (Select-String -Path "frontend-flutter/lib/version.dart" -Pattern "APP_VERSION = '([^']+)'").Matches[0].Groups[1].Value
          if (-not $VERSION) { Write-Error "版本提取失败"; exit 1 }
          Compress-Archive -Path "frontend-flutter/build/windows/x64/runner/Release/*" -DestinationPath "$env:TEMP/taozhu-windows-${VERSION}.zip"
          Get-Item "$env:TEMP/taozhu-windows-${VERSION}.zip" | Select-Object Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: ${{ runner.temp }}/taozhu-windows-*.zip
          retention-days: 1

      - name: 失败即取消整个 run（省掉其它平台的无效构建时间）
        if: failure() && steps.guard.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run cancel "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" || true
          echo "已取消整个 workflow（本版本未创建 release，无残留）"

  # ── macOS ──────────────────────────────────────────────────────────────────────────
  macos:
    needs: [test]
    if: github.repository == 'free-zuike/taozhu'
    runs-on: macos-latest
    name: macOS
    steps:
      - uses: actions/checkout@v4

      - name: Version guard（防覆盖已发布版本：同名 tag 已存在且非当前提交→失败）
        id: guard
        run: |
          VERSION=$(sed -n "s/.*APP_VERSION = '\([^']*\)'.*/\1/p" frontend-flutter/lib/version.dart | head -1)
          if [ -z "$VERSION" ]; then echo "::error::无法从 version.dart 提取版本号"; exit 1; fi
          git fetch --tags --quiet || true
          if git rev-parse -q --verify "refs/tags/taozhu-v${VERSION}" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "taozhu-v${VERSION}")
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::版本号未 bump：taozhu-v${VERSION} 已存在（指向 ${TAG_COMMIT}），当前提交 ${GITHUB_SHA}。发版前请先递增版本号，否则产物会覆盖旧 release。"
              exit 1
            fi
          fi
          echo "版本守卫通过：v${VERSION}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('frontend-flutter/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Generate platforms & build macOS
        working-directory: frontend-flutter
        run: |
          flutter create --org com.taozhu --project-name taozhu_app .
          # AI 语音记账：record 需麦克风用途说明 + 音频输入 capability（entitlement），缺失时 macOS 录音无权限/崩溃
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'AI 语音记账：录一句话描述刚才的出货/进货'" macos/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.device.audio-input bool true" macos/Runner/DebugProfile.entitlements
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.device.audio-input bool true" macos/Runner/Release.entitlements
          flutter build macos --release

      - name: Package macOS zip
        run: |
          VERSION=$(sed -n "s/.*APP_VERSION = '\([^']*\)'.*/\1/p" frontend-flutter/lib/version.dart | head -1 || exit 1)
          cd frontend-flutter/build/macos/Build/Products/Release && zip -qr "/tmp/taozhu-macos-${VERSION}.zip" taozhu_app.app && cd -
          ls -lh "/tmp/taozhu-macos-${VERSION}.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: /tmp/taozhu-macos-*.zip
          retention-days: 1

      - name: 失败即取消整个 run（省掉其它平台的无效构建时间）
        if: failure() && steps.guard.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run cancel "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" || true
          echo "已取消整个 workflow（本版本未创建 release，无残留）"


      - name: Version guard（防覆盖已发布版本：同名 tag 已存在且非当前提交→失败）
        id: guard-ios
        run: |
          VERSION=$(sed -n "s/.*APP_VERSION = '\([^']*\)'.*/\1/p" frontend-flutter/lib/version.dart | head -1)
          if [ -z "$VERSION" ]; then echo "::error::无法从 version.dart 提取版本号"; exit 1; fi
          git fetch --tags --quiet || true
          if git rev-parse -q --verify "refs/tags/taozhu-v${VERSION}" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "taozhu-v${VERSION}")
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::版本号未 bump：taozhu-v${VERSION} 已存在（指向 ${TAG_COMMIT}），当前提交 ${GITHUB_SHA}。发版前请先递增版本号，否则产物会覆盖旧 release。"
              exit 1
            fi
          fi
          echo "版本守卫通过：v${VERSION}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('frontend-flutter/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # CocoaPods spec 缓存：flutter build ios 自动 pod install，缓存避免每次下载 pod 源
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods
          key: ${{ runner.os }}-cocoapods

      - name: Generate platforms & build iOS (unsigned)
        working-directory: frontend-flutter
        run: |
          flutter create --org com.taozhu --project-name taozhu_app .
          # image_picker 需相机/相册用途说明（缺失时真机调用即崩溃）；flutter create 每次全新生成，直接 Add
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string '拍摄出货/进货/收款凭证'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string '选择出货/进货/收款凭证'" ios/Runner/Info.plist
          # AI 语音记账：record 需麦克风用途说明（缺失时真机录音即崩溃）
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'AI 语音记账：录一句话描述刚才的出货/进货'" ios/Runner/Info.plist
          flutter build ios --no-codesign

      - name: Package iOS zip (unsigned)
        run: |
          VERSION=$(sed -n "s/.*APP_VERSION = '\([^']*\)'.*/\1/p" frontend-flutter/lib/version.dart | head -1 || exit 1)
          cd frontend-flutter/build/ios/iphoneos && zip -qr "/tmp/taozhu-ios-${VERSION}-unsigned.zip" Runner.app && cd -
          ls -lh "/tmp/taozhu-ios-${VERSION}-unsigned.zip"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-ios
          path: /tmp/taozhu-ios-*.zip
          retention-days: 1

      - name: 失败即取消整个 run（省掉其它平台的无效构建时间）
        if: failure() && steps.guard-ios.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run cancel "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" || true
          echo "已取消整个 workflow（本版本未创建 release，无残留）"
  # ── iOS（未签名）──────────────────────────────────────────────────────────────────

  # ── 微信小程序（uni-app）──────────────────────────────────────────────────────────
  # 依赖全部平台成功：任一 Flutter 端失败则小程序不构建/不上传（全通过或全不通过）
  # ── 平台产物门槛：主仓库=5 平台全部成功才继续；fork 用户（平台 job 跳过）视为通过 ──

  miniprogram:
    needs: [test, apk, linux, windows, macos]
    if: ${{ always() && (github.repository != 'free-zuike/taozhu' || (needs.apk.result == 'success' && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success')) }}
    runs-on: ubuntu-latest
    name: 微信小程序
    steps:
      - uses: actions/checkout@v4

      - name: Version guard（防覆盖已发布版本：同名 tag 已存在且非当前提交→失败，与各端守卫一致）
        id: guard
        run: |
          VERSION=$(grep -oP '"versionName"\s*:\s*"\K[^"]+' frontend-uni/src/manifest.json | head -1)
          if [ -z "$VERSION" ]; then echo "::error::无法从 manifest.json 提取版本号"; exit 1; fi
          git fetch --tags --quiet || true
          if git rev-parse -q --verify "refs/tags/taozhu-v${VERSION}" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "taozhu-v${VERSION}")
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::版本号未 bump：taozhu-v${VERSION} 已存在（指向 ${TAG_COMMIT}），当前提交 ${GITHUB_SHA}。发版前请先递增版本号，否则产物会覆盖旧 release。"
              exit 1
            fi
          fi
          echo "版本守卫通过：v${VERSION}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-uni/package-lock.json

      # uni-app 依赖 node_modules 缓存（锁文件不变则 npm ci 几乎秒过）
      - name: Cache miniprogram node_modules
        uses: actions/cache@v4
        with:
          path: frontend-uni/node_modules
          key: uni-npm-${{ hashFiles('frontend-uni/package-lock.json') }}
          restore-keys: |
            uni-npm-

      - name: Install & build mp-weixin
        working-directory: frontend-uni
        run: |
          npm ci
          npm run build:mp-weixin

      - name: Upload to WeChat platform (miniprogram-ci)
        # 仅在配了密钥时上传；未配则跳过（只打 zip 留底）
        if: ${{ env.WX_APPID != '' && env.WX_PRIVATE_KEY != '' }}
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_PRIVATE_KEY: ${{ secrets.WX_PRIVATE_KEY }}
        run: |
          VERSION=$(grep -oP '"versionName"\s*:\s*"\K[^"]+' frontend-uni/src/manifest.json || echo "0.0.0")
          # 微信版本号要求 x.y.z（三段），截版本前三段
          MP_VER=$(echo "$VERSION" | cut -d. -f1-3)
          echo "$WX_PRIVATE_KEY" | base64 -d > /tmp/private.key
          npx miniprogram-ci@latest upload \
            --pp frontend-uni/dist/build/mp-weixin \
            --pkp /tmp/private.key \
            --appid "$WX_APPID" \
            --upload-version "$MP_VER" \
            --upload-message "陶朱 v$VERSION 自动上传" \
            -r 1 \
            || echo "::warning::微信上传失败（密钥/网络/白名单），详见日志；zip 产物已留底"
          rm -f /tmp/private.key

      - name: Package miniprogram zip
        # 有微信上传密钥才打包留底（fork 用户未配 secrets 则跳过；release 上传统一由 publish job 处理）
        if: ${{ env.WX_APPID != '' && env.WX_PRIVATE_KEY != '' }}
        run: |
          VERSION=$(grep -oP '"versionName"\s*:\s*"\K[^"]+' frontend-uni/src/manifest.json || exit 0)
          cd frontend-uni/dist/build/mp-weixin && zip -qr "/tmp/taozhu-miniprogram-${VERSION}.zip" . && cd -
          ls -lh "/tmp/taozhu-miniprogram-${VERSION}.zip"

      - name: Upload miniprogram artifact
        if: ${{ env.WX_APPID != '' && env.WX_PRIVATE_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: dist-miniprogram
          path: /tmp/taozhu-miniprogram-*.zip
          retention-days: 1

      - name: 失败即取消整个 run（省掉后续 job 的无效构建时间）
        if: failure() && steps.guard.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run cancel "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" || true
          echo "已取消整个 workflow（本版本未创建 release，无残留）"

  # ── 统一发布：全部平台成功后才创建 release + 一次上传所有产物 ──
  # 任一平台失败 → 本 job 不运行 → release 根本不创建（修复"失败残留半成品 release/draft"根因）
  publish:
    needs: [apk, linux, windows, macos, miniprogram]
    if: ${{ always() && (github.repository != 'free-zuike/taozhu' || (needs.apk.result == 'success' && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success' && needs.miniprogram.result == 'success')) }}
    runs-on: ubuntu-latest
    name: 统一发布（release+全部资产）
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/dist
          pattern: dist-*
          merge-multiple: true

      - name: Create release & upload all assets (一次性)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" frontend-flutter/lib/version.dart || exit 1)
          REL="taozhu-v${VERSION}"
          ls -lh /tmp/dist
          # 更新说明：从最近"已发布且带资产"的 tag 起累计（失败/空壳 tag 跳过，其功能 commit 并入本次说明）
          git fetch --tags --quiet || true
          LOG=$(bash .github/release-notes.sh "$VERSION" || true)
          if [ -z "$LOG" ]; then LOG="- 同步版本 ${VERSION}"; fi
          NOTES=$(printf '陶朱 v%s 更新内容：\n%s\n\n本版本全部产物：Android APK / Web / Windows / Linux / macOS / iOS / 微信小程序。' "$VERSION" "$LOG")
          # 平台 job 已全部成功 → 此时本版本无 release，直接创建
          [ -n "$(gh release view "$REL" --repo "$GITHUB_REPOSITORY" 2>/dev/null)" ] && \
            gh release delete "$REL" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$REL" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
            --title "陶朱 v${VERSION}" --notes "$NOTES"
          echo "release $REL 已创建，开始上传全部产物"
          for F in /tmp/dist/*; do
            [ -f "$F" ] || continue
            for _c in 1 2 3 4 5; do
              gh release upload "$REL" "$F" --repo "$GITHUB_REPOSITORY" --clobber && break
              echo "upload 重试 $_c/5 ($(basename "$F"))"
              sleep 5
            done
          done
          # 完整性校验：dist 目录里的每个文件都必须出现在 release 资产中
          MISSING=""
          UPLOADED=$(gh release view "$REL" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null)
          for F in /tmp/dist/*; do
            [ -f "$F" ] || continue
            FN=$(basename "$F")
            if ! echo "$UPLOADED" | grep -qx "$FN"; then MISSING="$MISSING $FN"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::release $REL 资产不完整（缺:$MISSING），删除整个 release。请递增版本号重新构建"
            gh release delete "$REL" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            exit 1
          fi
          echo "全部资产已上传（$REL）："
          echo "$UPLOADED"

      - name: 失败即删除 release+tag（发布不完整=版本作废，可复用版本号重建）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" frontend-flutter/lib/version.dart || true)
          [ -n "$VERSION" ] && gh release delete "taozhu-v${VERSION}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          echo "已删除不完整 release+tag（本版本未发布，零残留）"

  # ── Web（Flutter）构建：与各平台并行，最后 Deploy 直接用其产物（避免 Web 构建串行在链尾）──

  deploy:
    needs: [miniprogram, linux, publish]
    runs-on: ubuntu-latest
    name: Deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend deps
        run: npm install

      # 门禁已由 test job（依赖链首环）保证：deploy 是链尾，不需重复 typecheck/test
      - name: Download web build artifact (由 web job 并行构建)
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: frontend-flutter/build/web

      - name: Swap public dir with Flutter web build
        run: |
          rm -rf public
          cp -r frontend-flutter/build/web public

      # 检查更新兜底源：随部署生成 latest.json（与后端版本一致，Worker 在读 GitHub 失败时返回它；
      # 带上 release notes（更新说明），GitHub API 被墙/限流时备源仍能展示更新内容）
      - name: Generate latest.json (version metadata)
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" src/version.ts || exit 1)
          NOTES=$(gh release view "taozhu-v${VERSION}" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || echo '')
          export NOTES
          node -e "const n=process.env.NOTES||'';process.stdout.write(JSON.stringify({version:'${VERSION}',time:'$(date -u +%Y-%m-%dT%H:%M:%SZ)',notes:n.slice(0,2000)}))" > public/latest.json
          cat public/latest.json

      - name: Setup D1 database (auto-create if missing)
        if: env.CLOUDFLARE_API_TOKEN != ''
        id: d1
        run: |
          DB_ID=$(npx wrangler d1 list --json 2>/dev/null | node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const db = (data || []).find(d => d.name === 'taozhu');
            if (db) process.stdout.write(db.uuid);
          " || true)
          if [ -z "$DB_ID" ]; then
            echo "No existing D1 found, creating taozhu..."
            npx wrangler d1 create taozhu 2>&1 | tee create_out.txt || true
            DB_ID=$(grep -oP '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}' create_out.txt 2>/dev/null || true)
          fi
          if [ -z "$DB_ID" ]; then
            echo "FATAL: Could not resolve database_id"
            exit 1
          fi
          echo "database_id=$DB_ID" >> $GITHUB_OUTPUT
          echo "Resolved D1 database_id: $DB_ID"

      - name: Resolve account ID
        if: env.CLOUDFLARE_API_TOKEN != ''
        id: account
        run: |
          ACCOUNT_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=100" \
            | node -e "
              const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              if (!d.success || !d.result || d.result.length === 0) {
                console.error('Failed to resolve account_id:', JSON.stringify(d.errors || {}));
                process.exit(1);
              }
              process.stdout.write(d.result[0].id);
            ")
          if [ -z "$ACCOUNT_ID" ]; then
            echo "FATAL: Could not resolve account_id"
            exit 1
          fi
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "Resolved account_id: $ACCOUNT_ID"

      - name: Inject database_id into wrangler.toml
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          node -e "const fs=require('fs');let t=fs.readFileSync('wrangler.toml','utf8');t=t.replace('PLACEHOLDER_DATABASE_ID',process.argv[1]);fs.writeFileSync('wrangler.toml',t);" "${{ steps.d1.outputs.database_id }}"

      # 部署前建表（幂等）：生产库的表结构在发布时初始化，
      # 请求路径的 ensureSchema 降级为只读兜底，不再消耗每日 D1 写配额
      - name: Apply D1 schema (idempotent)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 execute taozhu --remote --file src/schema.sql

      # 附件 R2 bucket（不存在则创建；已存在会报 10004，忽略即可——幂等）
      # 不依赖 r2 bucket list 输出格式做存在性判断，避免误判
      - name: Setup R2 bucket (idempotent)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx wrangler r2 bucket create taozhu-attachments 2>&1 || true

      - name: Set JWT_SECRET
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler secret put JWT_SECRET --name taozhu <<< "${{ secrets.JWT_SECRET }}"

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}

      - name: 部署失败 → 删除整个 release 全部回退（本版本作废，需递增版本号重建）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" src/version.ts || true)
          # --cleanup-tag：release 关联的 git tag 一并删除——否则 tag 残留导致版本守卫判占用，同版本无法复用
          [ -n "$VERSION" ] && gh release delete "taozhu-v${VERSION}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

  # ── 失败兜底清理：任一平台/发布/部署失败 → 无条件删除本次 release+tag（存在即删，零残留）──
  # 注：新架构 release 只在 publish job（全部平台成功后）创建，发布/部署失败由各自失败步骤已删；
  # 本 job 兜底覆盖发布后 deploy 失败等场景
  cleanup-failed-release:
    needs: [apk, linux, windows, macos, miniprogram, publish, deploy]
    if: ${{ always() && failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" frontend-flutter/lib/version.dart || true)
          [ -n "$VERSION" ] || exit 0
          if gh release view "taozhu-v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # --cleanup-tag：关联 git tag 一并删除，版本守卫不再判占用，失败后可复用本版本号重推
            gh release delete "taozhu-v${VERSION}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            echo "已删除失败版本 release+tag（零残留，可复用本版本号重建）"
          else
            echo "本版本无 release（平台/发布失败时本来就不创建），无需清理"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
