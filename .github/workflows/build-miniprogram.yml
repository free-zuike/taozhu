name: Build Weixin Miniprogram

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-uni/package-lock.json

      - name: Install & build mp-weixin
        working-directory: frontend-uni
        run: |
          npm ci
          npm run build:mp-weixin

      - name: Upload miniprogram package
        uses: actions/upload-artifact@v4
        with:
          name: taozhu-miniprogram
          path: frontend-uni/dist/build/mp-weixin
          if-no-files-found: error