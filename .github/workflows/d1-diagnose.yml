name: D1 Diagnose

# 生产 D1 的 rows_read / 索引 / 查询计划诊断：全部由 CI 用仓库 secrets 自动执行，
# 结果打进 Actions 日志，用 `gh run view --log` 即可读取，无需在 Cloudflare 面板手工查询。
# 只读：诊断 SQL 只查 sqlite_master（约百行）与 EXPLAIN QUERY PLAN（不执行查询），
# 不会全表扫业务表消耗当日 rows_read 额度。
# 注：GraphQL Analytics / d1 insights 需要 API token 具备 Account Analytics Read 权限。
on:
  workflow_dispatch:
    inputs:
      period:
        description: '累计排行时间窗（1h / 1d / 7d）'
        required: false
        default: '1d'
  # 每 2 小时自动体检一次：不查业务表（GraphQL 分析 + sqlite_master + EXPLAIN），
  # 但会按当前小时速率外推 UTC 日终累计，额度快见底时提前在日志里告警。
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    name: D1 rows_read / 索引诊断
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps
        run: npm install

      - name: Resolve account & database id
        id: ids
        run: |
          ACCOUNT_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=100" \
            | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));process.stdout.write(d.result[0].id)")
          DB_ID=$(npx wrangler d1 list --json 2>/dev/null | node -e "
            const d=JSON.parse(require('fs').readFileSync(0,'utf8'));
            const x=(d||[]).find(v=>v.name==='taozhu');
            process.stdout.write(x?x.uuid:'')")
          if [ -z "$ACCOUNT_ID" ] || [ -z "$DB_ID" ]; then echo "FATAL: 无法解析 account/database id"; exit 1; fi
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');let t=fs.readFileSync('wrangler.toml','utf8');t=t.replace('PLACEHOLDER_DATABASE_ID',process.argv[1]);fs.writeFileSync('wrangler.toml',t)" "$DB_ID"
          echo "Resolved D1: $DB_ID"

      - name: D1 每小时 rowsRead（GraphQL Analytics）
        env:
          ACCOUNT_ID: ${{ steps.ids.outputs.account_id }}
          DB_ID: ${{ steps.ids.outputs.database_id }}
        run: |
          FROM=$(date -u -d '30 hours ago' +%Y-%m-%dT%H:00:00Z)
          TO=$(date -u -d '+1 hour' +%Y-%m-%dT%H:00:00Z)
          jq -n --arg a "$ACCOUNT_ID" --arg d "$DB_ID" --arg f "$FROM" --arg t "$TO" \
            '{query: ("query { viewer { accounts(filter: { accountTag: \"" + $a + "\" }) { d1AnalyticsAdaptiveGroups(limit: 5000, filter: { databaseId: \"" + $d + "\", datetime_geq: \"" + $f + "\", datetime_leq: \"" + $t + "\" }, orderBy: [datetime_ASC]) { dimensions { datetime } sum { readQueries writeQueries rowsRead rowsWritten } } } } }")}' \
            > /tmp/d1-hourly.json
          curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" --data @/tmp/d1-hourly.json \
            https://api.cloudflare.com/client/v4/graphql > /tmp/d1-hourly-out.json
          node -e "
            const d=JSON.parse(require('fs').readFileSync('/tmp/d1-hourly-out.json','utf8'));
            if(!d.data){console.log('GraphQL 失败: '+JSON.stringify(d.errors||d).slice(0,900));process.exit(0)}
            const g=(((d.data||{}).viewer||{}).accounts||[{}])[0]?.d1AnalyticsAdaptiveGroups||[];
            const h={}; let today=0; let queries=0;
            const day=new Date().toISOString().slice(0,10);
            for(const x of g){
              const k=String(x.dimensions.datetime).slice(0,13);
              const n=x.sum.rowsRead||0;
              h[k]=(h[k]||0)+n;
              queries+=x.sum.readQueries||0;
              if(k.startsWith(day)) today+=n;
            }
            console.log('=== D1 每小时 rowsRead（UTC） ===');
            for(const k of Object.keys(h).sort()) console.log(k+':00Z  rowsRead='+h[k]);
            console.log('=== 今日累计 rowsRead = '+today+' | readQueries = '+queries+' | 分钟样本 = '+g.length+' ===');
            // 按最近一个「完整 UTC 小时」的速率外推到 UTC 日终（D1 免费额度按 UTC 日重置）。
            // 面板口径通常比 GraphQL Analytics 高 15~20%（含系统/内部读），阈值按此留余量。
            const now=new Date();
            const curKey=now.toISOString().slice(0,13);
            const fullHours=Object.keys(h).filter(k=>k.startsWith(day)&&k<curKey).sort();
            const last=fullHours[fullHours.length-1];
            const rate=last?h[last]:0;
            const remain=24-now.getUTCHours()-now.getUTCMinutes()/60;
            const projected=Math.round(today+rate*remain);
            console.log('=== 额度预测（GraphQL 口径）: 近一完整小时 '+last+':00Z = '+rate+' 行/时 | 距 UTC 重置 '+remain.toFixed(1)+'h | 预计日终 = '+projected+' / 5,000,000 ===');
            if(projected>4200000) console.log('::warning::D1 免费额度可能不足：GraphQL 口径预计日终 '+projected+'，面板口径一般再高 15~20%，请降低同步频率或升级套餐');
            if(!g.length) console.log('(无数据) '+JSON.stringify(d).slice(0,800));
          " || true

      - name: D1 按 SQL 查询排行（wrangler d1 insights，官方 rows_read 排行）
        env:
          DB_ID: ${{ steps.ids.outputs.database_id }}
          PERIOD: ${{ inputs.period || '1d' }}
        run: |
          echo "=== 最近 1 小时 Top 查询（部署后止血效果） ==="
          npx --yes wrangler@latest d1 insights "$DB_ID" --sort-by=reads --time-period=1h --limit=30 --json 2>&1 | tee /tmp/insights-1h.json
          echo "=== 累计 Top 查询（$PERIOD，对照基线） ==="
          npx --yes wrangler@latest d1 insights "$DB_ID" --sort-by=reads --time-period="$PERIOD" --limit=30 --json 2>&1 | tee /tmp/insights-day.json
          echo "=== 格式化：最近 1 小时 ==="
          node -e "
            const fs=require('fs');let raw=fs.readFileSync('/tmp/insights-1h.json','utf8');
            const i=raw.indexOf('['); if(i<0){console.log(raw.slice(0,900));process.exit(0)}
            const a=JSON.parse(raw.slice(i));
            a.forEach((x,n)=>console.log('#'+(n+1)+' rowsRead='+x.totalRowsRead+' times='+x.numberOfTimesRun+'  '+String(x.query).replace(/\s+/g,' ').slice(0,170)));
            if(!a.length) console.log('(无数据)');
          " || true
          echo "=== 格式化：累计 $PERIOD ==="
          node -e "
            const fs=require('fs');let raw=fs.readFileSync('/tmp/insights-day.json','utf8');
            const i=raw.indexOf('['); if(i<0){console.log(raw.slice(0,900));process.exit(0)}
            const a=JSON.parse(raw.slice(i));
            a.forEach((x,n)=>console.log('#'+(n+1)+' rowsRead='+x.totalRowsRead+' times='+x.numberOfTimesRun+'  '+String(x.query).replace(/\s+/g,' ').slice(0,170)));
            if(!a.length) console.log('(无数据)');
          " || true

      - name: 索引与查询计划（只读诊断，不消耗业务行数）
        run: |
          echo "=== attachment_refs 索引 ==="
          npx wrangler d1 execute taozhu --remote --command "SELECT name, sql FROM sqlite_master WHERE type='index' AND tbl_name='attachment_refs'"
          echo "=== sale_items 索引（自证「缺 sale_id/client_id/happened_at 索引」类误判） ==="
          npx wrangler d1 execute taozhu --remote --command "SELECT name, sql FROM sqlite_master WHERE type='index' AND tbl_name='sale_items'"
          echo "=== 按 sale_id / client_id / 日期 过滤的查询计划（EXPLAIN 不执行查询） ==="
          npx wrangler d1 execute taozhu --remote --command "EXPLAIN QUERY PLAN SELECT id, sale_id FROM sale_items WHERE sale_id IN ('a','b')"
          npx wrangler d1 execute taozhu --remote --command "EXPLAIN QUERY PLAN SELECT client_id, sale_id, happened_at, amount FROM sale_items WHERE client_id = 'a'"
          npx wrangler d1 execute taozhu --remote --command "EXPLAIN QUERY PLAN SELECT client_id, sale_id, happened_at, amount FROM sale_items WHERE happened_at <= '2026-11-06' AND client_id = 'a'"
          echo "=== 旧形态 IN 查询计划 ==="
          npx wrangler d1 execute taozhu --remote --command "EXPLAIN QUERY PLAN SELECT entity_id, COUNT(*) FROM attachment_refs WHERE entity='sale_item' AND entity_id IN ('a','b') GROUP BY entity_id"
          echo "=== 新形态单次 GROUP BY 计划 ==="
          npx wrangler d1 execute taozhu --remote --command "EXPLAIN QUERY PLAN SELECT entity_id, COUNT(*) AS cnt FROM attachment_refs WHERE entity='sale_item' GROUP BY entity_id"
          echo "=== 一次性标记与快照状态（只取长度，不打印内容） ==="
          npx wrangler d1 execute taozhu --remote --command "SELECT key, length(value) AS bytes FROM schema_meta WHERE key LIKE 'attachment_%' OR key LIKE 'snapshot:%'"
