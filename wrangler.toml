name = "taozhu"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# 静态资源：前端构建产物放 ./public，由 Workers 直接托管（同源，与 API 同域）
[assets]
directory = "./public"
binding = "ASSETS"
# 前端是 Flutter hash 路由（/#/...），真实路径只有 / 与 /share/*——无需 SPA fallback。
# none：未匹配路径（如 /share/:token）一定进入 Worker 路由，绝不回退 index.html（登录页）
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "taozhu"
database_id = "PLACEHOLDER_DATABASE_ID"

# 附件存储（交易凭证图片）：R2 与 D1 配额独立，不消耗 D1 写配额
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "taozhu-attachments"