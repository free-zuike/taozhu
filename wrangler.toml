name = "taozhu"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# 静态资源：前端构建产物放 ./public，由 Workers 直接托管（同源，与 API 同域）
[assets]
directory = "./public"
binding = "ASSETS"
# SPA：未匹配路径（/login、/sale 等前端路由）回退 index.html
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "taozhu"
database_id = "PLACEHOLDER_DATABASE_ID"

# 附件存储（交易凭证图片）：R2 与 D1 配额独立，不消耗 D1 写配额
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "taozhu-attachments"